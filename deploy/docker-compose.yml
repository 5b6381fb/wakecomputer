name: wakecomputer

services:
  wakecomputer:
    image: ${WC_IMAGE:-wakecomputer:0.1.0}
    container_name: wakecomputer
    restart: unless-stopped
    # Host networking is required: UDP broadcast for Wake-on-LAN cannot
    # leave Docker's default bridge network.
    network_mode: host
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      WC_HTTP_ADDR: "${WC_HTTP_ADDR:-192.168.1.3:8085}"
      WC_DATA_DIR: /data
      WC_PUBLIC_URL: "${WC_PUBLIC_URL:-}"
      WC_TRUSTED_PROXIES: "${WC_TRUSTED_PROXIES:-192.168.1.3/32,172.16.0.0/12}"
      WC_WOL_DEFAULT_BROADCAST: "${WC_WOL_DEFAULT_BROADCAST:-192.168.1.255}"
      WC_LOG_LEVEL: "${WC_LOG_LEVEL:-info}"
      WC_LOG_FORMAT: "${WC_LOG_FORMAT:-json}"
      WC_ADMIN_PASSWORD: "${WC_ADMIN_PASSWORD:-}"
      GOMEMLIMIT: "96MiB"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=16m
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/app/wakecomputer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
